<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>4-Choice Quiz</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:#f7f7f5;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  color:#1a1a1a;user-select:none;padding:10px;}
.hud{display:flex;gap:18px;font-size:14px;}
.hud b{color:#1a1a1a;font-size:1.25em;}
.panel{background:#ffffff;border:1px solid #1a1a1a;border-radius:14px;
  box-shadow:0 8px 30px rgba(120,120,120,0.1);width:100%;max-width:440px;padding:22px 18px;}
.tip{font-size:11px;color:#555555;text-align:center;}
button{font:inherit;background:#1a1a1a;color:#ffffff;font-weight:800;border:none;
  border-radius:8px;padding:8px 16px;cursor:pointer;}
.badge{position:fixed;left:8px;bottom:6px;font-size:10px;color:#9a9a9a;letter-spacing:.1em;}

/* quiz specific */
#question{font-size:1.05em;line-height:1.65;margin-bottom:18px;min-height:3.5em;}
#choices{display:flex;flex-direction:column;gap:10px;}
.choice-btn{
  width:100%;text-align:left;padding:13px 15px;font-size:0.97em;
  background:#f0f0ee;color:#1a1a1a;border:1px solid #1a1a1a;
  border-radius:10px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s;
}
.choice-btn:active{opacity:.8;}
.choice-btn.correct{background:#eaf0ec;border-color:#1fc063;color:#00cb2f;}
.choice-btn.wrong  {background:#f0eaea;border-color:#db3423;color:#ff0000;}
.choice-btn:disabled{cursor:default;}

#result-panel{display:none;flex-direction:column;align-items:center;gap:16px;padding:10px 0;}
#result-msg{font-size:1.3em;font-weight:800;color:#1a1a1a;text-align:center;}
#result-sub{font-size:0.9em;color:#555555;text-align:center;}
#retry-btn{padding:12px 32px;font-size:1em;background:#1a1a1a;border-radius:10px;}

/* ---- 紙テイスト＋スマホで遊びやすくする調整 ---- */
html,body{ background:#f7f7f5; color:#1a1a1a; }
*{ -webkit-touch-callout:none; -webkit-user-select:none; -moz-user-select:none;
   -ms-user-select:none; user-select:none; }
html{ -webkit-text-size-adjust:100%; touch-action:manipulation; }
body{ touch-action:manipulation; overscroll-behavior:none; }
canvas,#board,.panel,#stage,.grid,.board{ touch-action:none; }
/* 盤面は縮小表示しても場所取りは元寸のままなので、狭い画面で横にはみ出す。中央で切る。 */
#stage{ max-width:100%; overflow:hidden; }
/* 読み込み時の幅を一度測ってサイズを決めるゲームが多く、
   画面を回した/枠が狭いと横にはみ出す。表示側で必ず収まるようにする。 */
img,canvas,svg{ max-width:100%; height:auto; }
body > *{ max-width:100%; }
.panel,#canvas-wrap,#board,#stage,.wrap,.board,.grid{ max-width:100%; }
button{ background:#1a1a1a; color:#fff; border:1.5px solid #1a1a1a; font-weight:700;
        white-space:nowrap; }
button:active{ background:#fff; color:#1a1a1a; }
.hud b{ color:#1a1a1a; }
/* 神経衰弱の裏面だけ、元が濃紺グラデだったため黒く沈む。紙に合わせて明るくする。 */
.card .back, .face.back{ background:#f0f0ee; border:1.5px solid #1a1a1a; color:#555555; }
.tip{ color:#555555; }
.badge{ color:#9a9a9a; }
</style>
</head>
<body>

<div class="hud">
  <span>Q <b id="qnum">1</b>/8</span>
  <span>SCORE <b id="score">0</b></span>
</div>

<div class="panel" id="main-panel">
  <div id="question"></div>
  <div id="choices"></div>
  <div id="result-panel">
    <div id="result-msg"></div>
    <div id="result-sub"></div>
    <button id="retry-btn">Retry</button>
  </div>
</div>

<div class="tip" id="tip-text">Tap a choice to answer</div>
<div class="badge">How to make puzzle game with AI — DEMO</div>

<script>
// ── 問題データ ──────────────────────────────────────────
const ALL_QUESTIONS = [
  {
    q: "What is the capital of the United States?",
    choices: ["New York", "Los Angeles", "Washington, D.C.", "Chicago"],
    answer: 2
  },
  {
    q: "Which star is closest to Earth?",
    choices: ["Sirius", "The Sun", "Altair", "Vega"],
    answer: 1
  },
  {
    q: "What is the chemical formula for water?",
    choices: ["CO₂", "NaCl", "H₂O", "O₂"],
    answer: 2
  },
  {
    q: "How many days are in a common (non-leap) year?",
    choices: ["360", "364", "365", "366"],
    answer: 2
  },
  {
    q: "Who painted the Mona Lisa?",
    choices: ["Michelangelo", "Leonardo da Vinci", "Raphael", "Botticelli"],
    answer: 1
  },
  {
    q: "What is the tallest mountain on Earth?",
    choices: ["K2", "Kangchenjunga", "Mount Everest", "Lhotse"],
    answer: 2
  },
  {
    q: "Which is the longest river in the world?",
    choices: ["Amazon", "Mississippi", "Yangtze", "Nile"],
    answer: 3
  },
  {
    q: "Approximately how fast does light travel in a vacuum?",
    choices: ["~300,000 km/s", "~30,000 km/s", "~300 km/s", "~3,000 km/s"],
    answer: 0
  }
];

// ── Web Audio（軽量効果音） ─────────────────────────────
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audioCtx;
}
function playBeep(freq, type, dur, vol) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  gain.gain.setValueAtTime(vol, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + dur);
}
function sfxCorrect() {
  playBeep(660, "sine", 0.18, 0.3);
  setTimeout(() => playBeep(880, "sine", 0.22, 0.25), 90);
}
function sfxWrong() {
  playBeep(220, "sawtooth", 0.3, 0.2);
}

// ── ゲーム状態 ─────────────────────────────────────────
let questions = [];
let currentIndex = 0;
let score = 0;
let answered = false;

// ── ユーティリティ：配列シャッフル ────────────────────
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── DOM refs ───────────────────────────────────────────
const elQnum     = document.getElementById("qnum");
const elScore    = document.getElementById("score");
const elQuestion = document.getElementById("question");
const elChoices  = document.getElementById("choices");
const elResult   = document.getElementById("result-panel");
const elResultMsg = document.getElementById("result-msg");
const elResultSub = document.getElementById("result-sub");
const elRetry    = document.getElementById("retry-btn");
const elTip      = document.getElementById("tip-text");

// ── 問題を表示 ─────────────────────────────────────────
function showQuestion() {
  answered = false;
  const q = questions[currentIndex];
  elQnum.textContent = currentIndex + 1;
  elQuestion.textContent = q.q;
  elChoices.innerHTML = "";
  elResult.style.display = "none";
  elChoices.style.display = "flex";
  elTip.textContent = "Tap a choice to answer";

  q.choices.forEach((text, idx) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.textContent = text;
    btn.addEventListener("click", () => onChoose(idx));
    elChoices.appendChild(btn);
  });
}

// ── 選択時の処理 ───────────────────────────────────────
function onChoose(idx) {
  if (answered) return;
  answered = true;

  const q = questions[currentIndex];
  const btns = elChoices.querySelectorAll(".choice-btn");

  btns.forEach(b => b.disabled = true);

  // 正解ボタンを緑に
  btns[q.answer].classList.add("correct");

  if (idx === q.answer) {
    score++;
    elScore.textContent = score;
    sfxCorrect();
    elTip.textContent = "✓ Correct!";
  } else {
    // 選んだ不正解を赤に
    btns[idx].classList.add("wrong");
    sfxWrong();
    elTip.textContent = "✗ Wrong…";
  }

  setTimeout(() => {
    currentIndex++;
    if (currentIndex < questions.length) {
      showQuestion();
    } else {
      showResult();
    }
  }, 900);
}

// ── 結果表示 ───────────────────────────────────────────
function showResult() {
  elChoices.style.display = "none";
  elQuestion.textContent = "";
  elResult.style.display = "flex";
  elQnum.textContent = 8;

  const total = questions.length;
  elResultMsg.textContent = `Result: ${score} / ${total} correct!`;

  let comment;
  if (score === total)       comment = "Perfect! Outstanding!";
  else if (score >= total * 0.75) comment = "Well done!";
  else if (score >= total * 0.5)  comment = "Almost there!";
  else                             comment = "Give it another shot!";
  elResultSub.textContent = comment;
  elTip.textContent = "Hit \"Retry\" to shuffle and play again";
}

// ── 再挑戦 ────────────────────────────────────────────
elRetry.addEventListener("click", startGame);

function startGame() {
  questions = shuffle(ALL_QUESTIONS);
  currentIndex = 0;
  score = 0;
  elScore.textContent = 0;
  showQuestion();
}

// ── 初期起動 ───────────────────────────────────────────
startGame();
</script>
<script>
/* 長押しの虫めがね・ダブルタップ拡大・ピンチ拡大・右クリックメニューを止める */
(function(){
  var stop=function(e){ e.preventDefault(); };
  document.addEventListener('contextmenu', stop);
  document.addEventListener('gesturestart', stop, {passive:false});
  document.addEventListener('gesturechange', stop, {passive:false});
  document.addEventListener('dblclick', stop, {passive:false});
  document.addEventListener('selectstart', stop);
  var last=0;
  document.addEventListener('touchend', function(e){
    var now=Date.now();
    if(now-last<=320){ e.preventDefault(); }   /* ダブルタップ拡大 */
    last=now;
  }, {passive:false});
})();
</script>
</body>
</html>
